services:
  - type: web
    name: electrolko
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: ElectroLKO
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: pNInz6obpgDQGcFmaJgB
      - key: ELEVENLABS_MODEL_ID
        value: eleven_multilingual_v2
      - key: OLLAMA_BASE_URL
        sync: false
      - key: MODAL_OLLAMA_URL
        sync: false
      - key: OLLAMA_MODEL
        sync: false
